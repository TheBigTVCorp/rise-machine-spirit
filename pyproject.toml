[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rise-machine-spirit"
version = "0.1.0"
description = "DWT/QIM PNG steganography for lossless WAV and FLAC carriers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1",
  "cryptography>=42",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "Pillow>=10",
  "PyWavelets>=1.6",
  "scipy>=1.11",
  "soundfile>=0.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.4",
]

[project.scripts]
rms = "rise_machine_spirit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
